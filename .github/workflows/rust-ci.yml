name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les runs obsolètes sur une même branche/PR.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Tests (nextest)
        run: cargo nextest run --workspace --all-features

      - name: Doctests
        # nextest ne lance pas les doctests : on les couvre séparément.
        run: cargo test --workspace --all-features --doc

  msrv:
    name: msrv (rust-version plancher)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV déclaré : $v"

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv

      - name: Check (prouve le plancher de compatibilité)
        run: cargo check --workspace --all-features --all-targets

  deny:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
