name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci.yaml"

# Annule les runs obsolètes sur une même branche/PR (symétrique de rust-ci).
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  # La CI Rust (rust/) est gérée séparément par rust-architect.
