# Configuration cargo-deny : sécurité (advisories), licences, bans, sources.
# Doc : https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences autorisées (permissives). Ajuste selon ta politique.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Interdit les dépendances externes en version `*`...
wildcards = "deny"
# ...mais exempte les crates internes du workspace (path-deps sans version :
# `domain`, `infra`), sinon elles sont comptées comme wildcards à tort.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
