name: rust_flutter_base
description: "Starter Flutter + Rust — clean architecture (feature-first, MVVM, Result)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  # Client HTTP vers le backend Rust : intercepteurs, baseUrl par flavor,
  # timeouts typés, erreurs remontées en DioException (catchées à la frontière
  # I/O par le repository). Pas de FFI : deux process distincts (cf. CLAUDE.md).
  dio: ^5.7.0
  # Valeurs immuables / égalité de valeur sans boilerplate
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State management + DI (Riverpod 3, API manuelle — pas de codegen requis)
  flutter_riverpod: ^3.0.0
  # Routing déclaratif
  go_router: ^14.2.0
  # i18n (dates, nombres, pluriels). `any` est volontaire : `flutter_localizations`
  # épingle déjà une version précise d'intl ; la borner ici provoquerait un
  # conflit de résolution au prochain bump du SDK Flutter.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Mocks sans codegen
  mocktail: ^1.0.4

  # Lints sévères
  very_good_analysis: ^6.0.0

# NB : pas de freezed / riverpod_generator dans ce scaffold initial pour rester
# sans build_runner. La bascule vers le codegen est documentée dans CLAUDE.md.

flutter:
  uses-material-design: true
  generate: true        # active gen-l10n (génère AppLocalizations au build)
