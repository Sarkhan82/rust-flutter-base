include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Annotations freezed/riverpod_generator si vous activez le codegen plus tard
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - "lib/core/rust/generated/**"   # bindings FFI générés (flutter_rust_bridge)

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    avoid_print: true
    require_trailing_commas: true
    public_member_api_docs: false    # mettre à true sur un package publié
    # Nos interfaces (repositories, bridges) ont souvent un seul membre au
    # départ et grossissent ensuite — un typedef de fonction ne convient pas.
    one_member_abstracts: false
